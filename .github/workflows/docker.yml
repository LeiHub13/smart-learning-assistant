name: Build Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: learning-assistant-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ai-service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: false
          tags: learning-assistant-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: learning-assistant-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
