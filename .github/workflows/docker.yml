name: Build and Publish Docker Images

on:
  push:
    branches: [main, agent]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test backend
        working-directory: backend
        run: mvn -q test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image names
        id: images
        shell: bash
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.images.outputs.prefix }}-backend:${{ steps.images.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build ai-service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.images.outputs.prefix }}-ai-service:${{ steps.images.outputs.tag }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.images.outputs.prefix }}-frontend:${{ steps.images.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Package deployment files
        if: github.event_name != 'pull_request'
        run: tar -czf deployment-package.tar.gz docker-compose.yml deploy.sh .env.example README.md DEPLOYMENT.md

      - name: Upload deployment package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: learning-assistant-deploy-${{ steps.images.outputs.tag }}
          path: deployment-package.tar.gz
          if-no-files-found: error
