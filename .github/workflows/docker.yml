name: Build Server Deployment Package

on:
  push:
    branches: [main, agent]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test backend
        working-directory: backend
        run: mvn -q test

      - name: Set up Python
        if: github.event_name != 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package committed build contexts
        if: github.event_name != 'pull_request'
        run: python scripts/package_deploy.py deployment-package.tar.gz --ref "${GITHUB_SHA}"

      - name: Upload deployment package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: learning-assistant-build-${{ github.sha }}
          path: deployment-package.tar.gz
          if-no-files-found: error
