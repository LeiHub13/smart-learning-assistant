server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  application:
    name: learning-assistant
  datasource:
    # 默认直连 MySQL；Docker 内由 compose 注入 SPRING_DATASOURCE_* 覆盖
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:learning_assistant}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:1234}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    time-zone: Asia/Shanghai
  mail:
    # 邮件通知：默认关闭，设 MAIL_ENABLED=true 且提供 SMTP 参数后启用
    # QQ 邮箱示例：MAIL_HOST=smtp.qq.com，密码填授权码（非登录密码）
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:3917997689@qq.com}
    password: ${MAIL_PASSWORD:jdnazkyybfmmcgdd}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL:true}   # 465 端口用 SSL；587 端口设 false 并开 starttls
          starttls:
            enable: ${MAIL_STARTTLS:false}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  # 复杂查询 SQL 落点：各模块 resources/mapper/*.xml
  mapper-locations: classpath*:mapper/**/*.xml

app:
  security:
    # 生产环境务必更换并通过环境变量注入
    jwt-secret: learning-assistant-v2-jwt-secret-please-change-me-0123456789
    access-ttl-ms: 7200000      # 2h
    refresh-ttl-ms: 604800000   # 7d
  model:
    # LLM 接入：python(Python langchain ai-service) | openai-compatible(OpenAI/通义/DeepSeek/智谱等) | spring-ai(Spring AI 框架, 内置 Tool Calling)
    provider: python
    python-base-url: http://localhost:8000
    # Agent 模式：true 时答疑(RAG_QA/FREE)升级为 ReAct Agent，模型自主调用检索工具，接口不变
    agent-enabled: true
    base-url: https://api.openai.com/v1
    api-key: ""
    model-name: gpt-4o-mini
    temperature: 0.7
  infra:
    # 中间件开关：配置了真实中间件即切换，未配置/未填则自动使用内存降级实现
    # 向量库不在此列：RAG 检索链路已整体迁移到 ai-service（Chroma），Java 侧不再持有向量
    cache-mode: redis      # memory | redis
    storage-mode: minio     # local | minio
    mq-mode: rabbit        # memory | rabbit
    storage:
      local-path: ./data/files
      minio:
        endpoint: http://localhost:9000
        access-key: minioadmin
        secret-key: minioadmin123
  # 内部工具 API 鉴权（ai-service 的 Agent 工具回调、chunk 下发与 RAG 端点共用这把 token）
  internal-tool-token: ${INTERNAL_TOOL_TOKEN:internal-tool-token}
  notify:
    # 邮件渠道开关：true 时站内信同步外发邮件（用户已绑定邮箱才会发）
    email-enabled: ${MAIL_ENABLED:false}
  email-code:
    # 邮箱验证码（注册验证邮箱 / 重置密码）：复用 spring.mail 的 SMTP 配置发信，
    # 与通知邮件开关 app.notify.email-enabled 相互独立，SMTP 配置好即可用
    ttl-seconds: 600        # 验证码有效期：10 分钟
    cooldown-seconds: 60    # 同邮箱同场景发送冷却

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.learningassistant: info
