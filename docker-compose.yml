# Docker Compose 一键编排：前端(nginx) + 后端(Java) + AI 服务(Python) + MySQL
# 用法：根目录建 .env（复制 .env.example）→ 填 AI_API_KEY → ./deploy.sh up
name: learning-assistant

services:
  mysql:
    image: mysql:8.4
    container_name: la-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-learning_assistant}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [la-net]

  # Redis 缓存：backend 默认 cache-mode=redis，经 healthcheck 就绪后再启动 backend
  redis:
    image: redis:7-alpine
    container_name: la-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [la-net]

  # MinIO 对象存储：头像/文档原件（backend 默认 storage-mode=minio）
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: la-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      # API 9000 仅内网使用；控制台绑回环供管理员调试
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [la-net]

  backend:
    build:
      context: ./backend
    container_name: la-backend
    restart: unless-stopped
    environment:
      # 数据库：连接 compose 内的 mysql 服务（镜像内 schema.sql 自动建表）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-learning_assistant}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      # 容器内访问 ai-service 容器名，覆盖 application.yml 的 localhost:8000
      # 注意：属性路径为 app.model.*，对应环境变量前缀 APP_MODEL_*（此前误写为 SPRING_APP_*，覆盖不生效）
      APP_MODEL_PYTHON_BASE_URL: http://ai-service:8000
      APP_MODEL_PROVIDER: python
      # 生产建议通过环境变量覆盖默认密钥（属性路径 app.security.jwt-secret）
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET:-learning-assistant-v2-jwt-secret-please-change-me-0123456789}
      # Redis 缓存：默认启用，指向 compose 内 redis 服务
      APP_INFRA_CACHE_MODE: ${CACHE_MODE:-redis}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      # RabbitMQ 缺交换机声明与消费者，编排内保持内存实现
      APP_INFRA_MQ_MODE: ${MQ_MODE:-memory}
      # 对象存储：默认 MinIO（.env 设 STORAGE_MODE=local 可回退容器内本地文件）
      APP_INFRA_STORAGE_MODE: ${STORAGE_MODE:-minio}
      APP_INFRA_STORAGE_MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      APP_INFRA_STORAGE_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      APP_INFRA_STORAGE_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      # 邮件通知渠道：.env 配置 MAIL_ENABLED=true + SMTP 参数后启用
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SSL: ${MAIL_SSL:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
    volumes:
      - backend-data:/app/data
    ports:
      # 仅绑回环：Swagger/登录接口不暴露公网，前端容器走内网 backend:8080 不受影响；
      # 如需公网直连调试，临时改回 "8080:8080"
      - "127.0.0.1:8080:8080"
    networks: [la-net]
    depends_on:
      ai-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
    container_name: la-ai
    restart: unless-stopped
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-agnes}
      AI_API_KEY: ${AI_API_KEY:?请在根目录 .env 配置 AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL:-https://apihub.agnes-ai.com/v1}
      AI_MODEL: ${AI_MODEL:-agnes-3.0-flash}
      AI_HOST: 0.0.0.0
      AI_PORT: 8000
      # RAG 检索链路（自 Java 侧迁移过来）：Chroma 向量索引落在 ai-data 卷内，随容器重启保留
      RAG_CHROMA_DIR: /app/data/chroma
      # 向量化模型：hash（离线字符 n-gram，默认）| dashscope（通义 text-embedding-v3）
      # 切换 provider 后需调用一次 POST /api/kb/reindex 重建索引（维度不同）
      RAG_EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      RAG_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      RAG_EMBEDDING_API_KEY: ${DASHSCOPE_API_KEY:-}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      # 文档解析与分块（自 Java 侧迁移）：定长切块块大小，与原 Java CHUNK_SIZE 同值
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-200}
      RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-true}
      RAG_REWRITE_ENABLED: ${RAG_REWRITE_ENABLED:-true}
      # MCP 外部工具接入（JSON，格式同 Claude/Cursor mcpServers）
      # 留空默认启用自带 web-search（Bing 中文免key）；.env 设 AI_MCP_CONFIG=none 关闭，或传 JSON 换 tavily-mcp 等
      AI_MCP_CONFIG: ${AI_MCP_CONFIG:-}
      # Agent 工具回调 + chunk 下发：Java 内部 API（容器间访问）
      JAVA_TOOL_BASE: http://backend:8080
      JAVA_TOOL_TOKEN: ${INTERNAL_TOOL_TOKEN:-internal-tool-token}
    volumes:
      - ai-data:/app/data
    networks: [la-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/ai/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: la-web
    restart: unless-stopped
    ports:
      - "80:80"
    networks: [la-net]
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  minio-data:
  backend-data:
  # ai-service 数据：会话记忆 data/memory + 向量索引 data/chroma
  ai-data:

networks:
  la-net:
    driver: bridge