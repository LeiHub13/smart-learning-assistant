<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智学助手 - 基于大语言模型的智能学习助手</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  /* GitHub Primer Light 令牌 */
  --primary: #0969da; --primary-dark: #0550ae; --accent: #0969da;
  --accent-deep: #0550ae;
  --success: #1a7f37; --success-emph: #1f883d;
  --danger: #cf222e;
  --bg: #ffffff; --card: #fff; --text: #1f2328;
  --muted: #59636e; --border: #d1d9e0; --soft: #f6f8fa;
  --accent-subtle: #ddf4ff;
}
html, body { background: var(--bg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color: var(--text); font-size: 14px;
}
#app { height: 100vh; display: flex; background: transparent; }
::selection { background: rgba(9,105,218,.25); }

/* 全局细滚动条 */
* { scrollbar-width: thin; scrollbar-color: rgba(140,149,159,.4) transparent; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: rgba(140,149,159,.4); border-radius: 8px;
  border: 2px solid transparent; background-clip: content-box;
}
*::-webkit-scrollbar-thumb:hover {
  background: rgba(140,149,159,.6); border: 2px solid transparent; background-clip: content-box;
}

/* 启动遮罩：Vue 挂载前显示，杜绝白屏 */
.boot-splash {
  position: fixed; inset: 0; z-index: 999;
  display: flex; align-items: center; justify-content: center;
  gap: 10px; color: var(--muted); background: var(--bg);
}
.boot-splash i {
  width: 20px; height: 20px; border: 2px solid #d1d9e0;
  border-top-color: var(--primary); border-radius: 50%;
  animation: bootsp .8s linear infinite;
}
@keyframes bootsp { to { transform: rotate(360deg); } }

/* ======== 侧边栏（GitHub Settings 左栏风格：白底 + 灰边，选中浅蓝） ======== */
.sidebar {
  width: 232px; flex-shrink: 0; background: var(--bg); color: var(--muted);
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border);
}
.sidebar .logo {
  padding: 22px 20px 16px; font-size: 16px; font-weight: 700; color: var(--text);
  display: flex; align-items: center; gap: 10px; letter-spacing: -.01em;
  position: relative;
}
.sidebar .logo::after {
  content: ''; position: absolute; left: 20px; right: 20px; bottom: 0;
  height: 1px; background: var(--border);
}
.sidebar .logo i {
  width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0;
  background: #24292f;
  display: inline-flex; align-items: center; justify-content: center;
}
.sidebar .logo i::before {
  content: ''; width: 9px; height: 9px; border-radius: 2.5px;
  background: #fff;
}
.sidebar nav { flex: 1; padding: 12px; overflow-y: auto; }
.sidebar nav button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 8px 10px; margin-bottom: 2px; border: none; border-radius: 6px;
  background: transparent; color: var(--text); font-size: 14px; cursor: pointer; transition: .15s ease;
  position: relative;
}
.sidebar nav button .m-ico {
  width: 24px; height: 24px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1; border-radius: 6px;
  color: var(--muted);
  transition: .15s ease;
}
.sidebar nav button:hover { background: var(--soft); }
.sidebar nav button:hover .m-ico { color: var(--text); }
.sidebar nav button.on {
  background: var(--accent-subtle); color: var(--primary); font-weight: 600;
}
.sidebar nav button.on .m-ico { color: var(--primary); }
.sidebar nav button.on::before {
  content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
  width: 3px; border-radius: 3px; background: var(--primary);
}
.sidebar nav .m-txt { line-height: 1.3; }
.sidebar nav::-webkit-scrollbar { width: 6px; }
.sidebar nav::-webkit-scrollbar-thumb {
  background: rgba(140,149,159,.35); border: none; border-radius: 6px;
}

/* ======== 顶栏 ======== */
.right { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 60px; flex-shrink: 0; background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; gap: 12px;
  position: relative; z-index: 40;
}
.topbar .tb-title {
  font-size: 15px; font-weight: 600; letter-spacing: -.01em;
  display: flex; align-items: center; gap: 10px;
}
.topbar .tb-right { position: relative; display: flex; align-items: center; gap: 16px; }
.topbar .tb-user { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.topbar .avatar {
  width: 32px; height: 32px; border-radius: 6px; background: var(--soft);
  border: 1px solid var(--border);
  color: var(--muted); display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; flex-shrink: 0;
}
.topbar .tb-name { font-size: 13px; font-weight: 600; line-height: 1.2; }
.topbar .tb-role { font-size: 11px; color: var(--muted); line-height: 1.2; }

/* ======== 主区域 ======== */
.main {
  flex: 1; overflow: auto; padding: 24px 32px 40px;
  scrollbar-gutter: stable;
}
.page-title { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.page-sub { color: var(--muted); margin: 6px 0 24px; line-height: 1.7; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 20px; margin-bottom: 16px;
  transition: box-shadow .2s ease, border-color .2s ease;
}
.card:hover { box-shadow: 0 1px 3px rgba(31,35,40,.08), 0 8px 24px rgba(31,35,40,.06); }
.card h3 { font-size: 16px; margin-bottom: 14px; letter-spacing: -.01em; }
.empty { text-align: center; color: var(--muted); padding: 34px 0; }
.loading {
  padding: 60px 0; text-align: center; color: var(--muted);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.loading i {
  width: 15px; height: 15px; border: 2px solid #d1d9e0;
  border-top-color: var(--primary); border-radius: 50%;
  animation: bootsp .8s linear infinite;
}

/* ======== 控件（GitHub 按钮风格：灰底描边 6px 圆角，primary 绿） ======== */
.btn {
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  padding: 7px 14px; border: 1px solid rgba(31,35,40,.15); border-radius: 6px;
  background: var(--soft); color: var(--text);
  font-size: 14px; font-weight: 500; line-height: 1.4;
  white-space: nowrap; cursor: pointer;
  transition: background .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.btn:hover { background: #f3f4f6; border-color: rgba(31,35,40,.25); }
.btn:active { background: #eef0f3; box-shadow: inset 0 1px 2px rgba(31,35,40,.12); }
.btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
.btn.ghost { background: #fff; }
.btn.ghost:hover { background: var(--soft); }
.btn.ghost:active { background: #eef0f3; }
.btn.accent { background: var(--success-emph); border-color: rgba(31,35,40,.15); color: #fff; }
.btn.accent:hover { background: var(--success); }
.btn.accent:active { background: #188531; box-shadow: inset 0 1px 2px rgba(0,0,0,.15); }
.btn.danger { background: #fff; border-color: rgba(31,35,40,.15); color: var(--danger); }
.btn.danger:hover { background: var(--danger); border-color: rgba(31,35,40,.15); color: #fff; }
.btn.danger:active { box-shadow: inset 0 1px 2px rgba(0,0,0,.15); }
.btn.small { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
/* :where 零特异性：无 type 的文本输入也吃全局样式，且不压过 .global-search 等自定义类 */
input:where([type=text], [type=password], [type=number], [type=email], [type=search], [type=tel], [type=url], [type=date], :not([type])), textarea, select {
  width: 100%; padding: 7px 12px; border: 1px solid var(--border);
  border-radius: 6px; font-size: 14px; font-family: inherit; background: var(--bg);
  outline: none; transition: .15s ease;
}
input:focus, textarea:focus, select:focus { border-color: var(--primary); outline: 2px solid rgba(9,105,218,.3); outline-offset: -1px; }
/* Element Plus 输入框：外框由 .el-input__wrapper 负责，这里屏蔽上面的全局规则，
   否则内层 <input> 会长出第二层边框、内边距和聚焦光环。.el-input__inner 选择器特异性更高，顺序无关。 */
.el-input .el-input__inner,
.el-input .el-input__inner:focus {
  padding: 0; border: none; border-radius: 0; background: transparent; box-shadow: none;
}
.el-input {
  --el-color-primary: var(--accent); --el-border-color: var(--border);
  --el-border-color-hover: var(--primary); --el-border-color-focus: var(--primary);
  --el-border-radius-base: 6px; --el-font-size-base: 13px;
}
textarea { resize: vertical; min-height: 80px; }
.label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 12px; align-items: center; }
.row > * { flex: 1; }
/* 按钮和图片不参与拉伸，保持自然宽度（避免被拉成长条） */
.row > button, .row > img, .row > a, .row > span { flex: 0 0 auto; }
/* 上面把 span 一起钉成了不可压缩，装用户内容（文件名等无空格长串）时会把同行按钮顶出容器。
   .shrink 给这类文本格重新开放收缩并允许任意断行，按钮保持 flex:0 0 auto 钉在右侧。 */
.row > .shrink { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.row .btns { flex: 0 0 auto; display: flex; gap: 10px; align-items: flex-end; align-self: flex-end; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tag {
  display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px;
  background: var(--accent-subtle); color: var(--primary);
}
.tag.ok { background: #dafbe1; color: var(--success); }
.tag.bad { background: #ffebe9; color: var(--danger); }
.err {
  background: #ffebe9; border: 1px solid #ffc1bc; color: #a40e26;
  padding: 10px 14px; border-radius: 6px; margin-bottom: 14px;
}

/* ======== 答疑 ======== */
.chat-wrap { display: flex; gap: 16px; height: calc(100vh - 60px - 68px); }
.side {
  width: 252px; flex-shrink: 0; display: flex; flex-direction: column;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px; overflow: hidden; margin-bottom: 0;
  box-shadow: none; transition: none;
}
.chat-wrap .side.card:hover { box-shadow: none; }
.mode-tabs { display: flex; gap: 4px; margin: 4px 0 12px; background: var(--soft); border: 1px solid var(--border); border-radius: 6px; padding: 3px; }
.mode-tabs button {
  flex: 1; padding: 6px 0; border: none; border-radius: 4px;
  background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
  transition: .15s ease;
}
.mode-tabs button:hover { color: var(--text); }
.mode-tabs button.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(31,35,40,.1); }
.sess-list { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.sess {
  padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
  display: flex; align-items: center; gap: 6px;
  overflow: hidden; margin-bottom: 2px; transition: background .15s ease;
}
.sess .sess-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess-mode-tag {
  font-size: 10px; padding: 1px 6px; border-radius: 999px; background: var(--soft);
  color: var(--muted); flex-shrink: 0;
}
.sess.on .sess-mode-tag { background: var(--accent-subtle); color: var(--primary); }
.sess-ops { display: none; gap: 2px; flex-shrink: 0; }
.sess:hover .sess-ops { display: flex; }
.sess.on .sess-ops { display: flex; }
.sess-btn {
  border: none; background: transparent; color: var(--muted); cursor: pointer;
  width: 20px; height: 20px; line-height: 20px; border-radius: 4px; font-size: 12px;
}
.sess-btn:hover { background: rgba(31,35,40,.08); color: var(--text); }
.sess.on .sess-btn:hover { background: rgba(9,105,218,.18); }
.sess-input {
  flex: 1; padding: 4px 8px; border: 1px solid var(--primary); border-radius: 6px;
  font-size: 13px; outline: none; min-width: 0;
}
.sess:hover { background: var(--soft); }
.sess.on { background: var(--accent-subtle); color: var(--primary-dark); font-weight: 600; }
.chatbox {
  flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--card);
  border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
}
.msgs { flex: 1; overflow-y: auto; padding: 22px 24px; }
.m { display: flex; gap: 10px; margin-bottom: 18px; animation: msg-in .22s ease; }
@keyframes msg-in { from { opacity: 0; transform: translateY(6px); } }
.m .av {
  width: 30px; height: 30px; border-radius: 6px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px;
}
.m.me { flex-direction: row-reverse; }
.m.me .av { background: #24292f; }
.m.ai .av { background: #59636e; }
.m .bub {
  max-width: 76%; padding: 11px 14px; border-radius: 4px 8px 8px 8px; line-height: 1.75;
  background: var(--soft); border: 1px solid var(--border);
}
.m.me .bub { background: var(--primary); color: #fff; border-color: var(--primary); border-radius: 8px 4px 8px 8px; }
.bub p { margin: 4px 0; }
.bub ul { padding-left: 18px; margin: 4px 0; }
.bub h1, .bub h2, .bub h3, .bub h4 { margin: 8px 0 4px; }
.bub pre {
  background: var(--soft); color: var(--text); border: 1px solid var(--border);
  padding: 12px; border-radius: 6px;
  overflow-x: auto; font-size: 12.5px; margin: 8px 0; line-height: 1.6;
}
.bub pre code { background: transparent; padding: 0; color: inherit; }
.bub blockquote { border-left: 3px solid #d1d9e0; padding-left: 10px; color: var(--muted); margin: 6px 0; }
.bub code { background: rgba(175,184,193,.2); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
.m.me .bub code { background: rgba(255,255,255,.22); }
.sources {
  margin-top: 8px; font-size: 12px; color: var(--primary);
  background: var(--accent-subtle); border-radius: 6px; padding: 6px 10px; line-height: 1.7;
}
.stream-txt { white-space: pre-wrap; word-break: break-word; }
.cursor {
  display: inline-block; width: 8px; height: 15px; background: var(--primary);
  vertical-align: -2px; animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.input-bar {
  border-top: 1px solid var(--border); padding: 14px 18px;
  display: flex; gap: 12px; align-items: flex-end;
  background: var(--bg);
}
.input-bar textarea { flex: 1; min-height: 44px; max-height: 130px; border-radius: 6px; }
.input-bar .btn { border-radius: 6px; height: 44px; padding: 0 20px; }

/* ======== Markdown 渲染（mdToHtml：答疑/讲义/学情建议/学习报告 v-html 内容） ======== */
.md-divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
.md-table-wrap { overflow-x: auto; margin: 8px 0; }
.md-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.md-table th, .md-table td {
  border: 1px solid var(--border); padding: 7px 10px; line-height: 1.65;
  text-align: left; vertical-align: top;
}
.md-table th { background: var(--soft); font-weight: 600; white-space: nowrap; }
.md-table tbody tr:nth-child(even) { background: #fafbfc; }

/* ======== 练习 ======== */
.q {
  padding: 16px 18px; margin-bottom: 12px; background: #fff;
  border: 1px solid var(--border); border-radius: 8px;
}
.q .head { display: flex; justify-content: space-between; margin-bottom: 10px; }
.q .type { font-weight: 600; color: var(--primary); }
.q .kp { color: var(--muted); font-size: 12px; }
.opt {
  display: block; padding: 8px 12px; margin: 6px 0; border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer;
}
.opt:hover { border-color: var(--primary); }
.opt.on { border-color: var(--primary); background: var(--accent-subtle); }
.opt input { margin-right: 8px; }
.ans { margin-top: 8px; padding: 8px 12px; background: var(--soft); border-radius: 6px; font-size: 13px; }
.ans.ai { background: var(--accent-subtle); color: var(--primary); }
.stat { text-align: center; padding: 14px; }
.stat .num { font-size: 25px; font-weight: 700; color: var(--primary); }
.stat .lab { color: var(--muted); font-size: 12px; margin-top: 3px; }
.pass { border-left: 4px solid #1a7f37; }
.fail { border-left: 4px solid #cf222e; }

/* ======== 学情 ======== */
.mb { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.mb .nm { width: 110px; flex-shrink: 0; }
.mb .tr { flex: 1; height: 10px; background: #eff1f3; border-radius: 6px; overflow: hidden; }
.mb .fl { height: 100%; background: linear-gradient(90deg,#f43f5e,#f59e0b,#10b981); }
.mb .vl { width: 42px; text-align: right; font-weight: 600; }
.mb .ct { width: 70px; color: var(--muted); font-size: 12px; }

/* ======== 表格 ======== */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
th { color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: none; }
tbody tr { transition: background .15s ease; }
tbody tr:hover { background: var(--soft); }
a.link { color: var(--primary); cursor: pointer; }
a.link:hover { text-decoration: underline; }

/* ======== 生成 ======== */
.gen { background: #24292f; color: #e6edf3; border-radius: 8px; padding: 20px; line-height: 1.85; font-size: 13.5px; white-space: pre-wrap; max-height: 460px; overflow-y: auto; }
.qi { padding: 14px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; background: #fff; transition: border-color .2s ease; }
.qi:hover { border-color: #8c959f; }
.qi .hd { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }

/* ======== 路由过渡 ======== */
.page-fade-enter-active { transition: opacity .22s ease, transform .22s ease; }
.page-fade-leave-active { transition: opacity .12s ease; }
.page-fade-enter-from { opacity: 0; transform: translateY(8px); }
.page-fade-leave-to { opacity: 0; }

/* ======== 弹窗 ======== */
.modal-mask {
  position: fixed; inset: 0; z-index: 200; background: rgba(31,35,40,.5);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  animation: mask-in .18s ease;
}
@keyframes mask-in { from { opacity: 0; } }
.modal-box {
  background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 24px;
  width: min(400px, 92vw); box-shadow: 0 8px 40px rgba(31,35,40,.2);
  animation: box-in .22s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes box-in { from { opacity: 0; transform: translateY(10px) scale(.97); } }
.modal-box h3 { margin-bottom: 10px; font-size: 16px; letter-spacing: -.01em; }
.modal-box p { color: var(--muted); font-size: 13px; line-height: 1.8; margin-bottom: 18px; word-break: break-all; }
.modal-ops { display: flex; justify-content: flex-end; gap: 10px; }

/* ======== 响应式适配 ======== */

/* 平板（≤1024px） */
@media (max-width: 1024px) {
  .main { padding: 18px 16px; }
  .grid2 { grid-template-columns: 1fr; }
}

/* 手机（≤768px）：侧边栏 → 顶部导航栏，内容纵向堆叠 */
@media (max-width: 768px) {
  #app { height: 100vh; height: 100dvh; flex-direction: column; }

  /* 侧边栏变顶栏 */
  .sidebar {
    width: 100%; flex-direction: row; align-items: center;
    padding: 8px 10px; gap: 8px;
    position: sticky; top: 0; z-index: 50;
    border-right: none; border-bottom: 1px solid var(--border);
  }
  .sidebar .logo { padding: 0; font-size: 14px; gap: 8px; flex-shrink: 0; }
  .sidebar .logo::after { display: none; }
  .sidebar .logo i { width: 20px; height: 20px; }
  .sidebar nav {
    flex: 1; display: flex; gap: 4px; padding: 0;
    overflow-x: auto; scrollbar-width: none;
  }
  .sidebar nav::-webkit-scrollbar { display: none; }
  .sidebar nav button {
    width: auto; flex: 1 0 auto; text-align: center; justify-content: center;
    padding: 8px 10px; font-size: 13px; margin: 0; white-space: nowrap;
    flex-direction: column; gap: 4px;
  }
  .sidebar nav button .m-ico {
    width: 22px; height: 22px; font-size: 13px; border-radius: 6px;
  }
  .sidebar nav button.on::before { display: none; }
  .sidebar nav .m-txt { font-size: 11px; line-height: 1.1; }

  /* 顶栏 */
  .topbar { padding: 0 12px; gap: 8px; }
  .topbar .tb-title { font-size: 14px; }
  .topbar .tb-right { gap: 10px; }
  .topbar .tb-user-info { display: none; }

  /* 主区?*/
