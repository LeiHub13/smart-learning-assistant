<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智学助手 - 基于大语言模型的智能学习助手</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #4f46e5; --primary-dark: #4338ca; --accent: #4f46e5;
  --accent-deep: #4338ca;
  --grad: linear-gradient(120deg, #7c3aed, #4f46e5 45%, #2563eb);
  --bg: #f7f8fc; --card: #fff; --text: #14161f;
  --muted: #6b7186; --border: #e4e7f0; --soft: #f6f7fb;
}
html, body { background: var(--bg); }
body {
  font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text); font-size: 14px;
  background-image:
    radial-gradient(1000px 520px at 88% -10%, rgba(124,58,237,.08), transparent 62%),
    radial-gradient(860px 480px at -8% 110%, rgba(37,99,235,.07), transparent 60%),
    linear-gradient(rgba(20,22,31,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(20,22,31,.018) 1px, transparent 1px);
  background-size: auto, auto, 44px 44px, 44px 44px;
  background-attachment: fixed;
}
#app { height: 100vh; display: flex; background: transparent; }
::selection { background: rgba(79,70,229,.18); }

/* 全局细滚动条 */
* { scrollbar-width: thin; scrollbar-color: rgba(100,106,135,.32) transparent; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: rgba(100,106,135,.3); border-radius: 8px;
  border: 2px solid transparent; background-clip: content-box;
}
*::-webkit-scrollbar-thumb:hover {
  background: rgba(100,106,135,.5); border: 2px solid transparent; background-clip: content-box;
}

/* 启动遮罩：Vue 挂载前显示，杜绝白屏 */
.boot-splash {
  position: fixed; inset: 0; z-index: 999;
  display: flex; align-items: center; justify-content: center;
  gap: 10px; color: var(--muted); background: var(--bg);
}
.boot-splash i {
  width: 20px; height: 20px; border: 2px solid #dbe3f5;
  border-top-color: var(--primary); border-radius: 50%;
  animation: bootsp .8s linear infinite;
}
@keyframes bootsp { to { transform: rotate(360deg); } }

/* ======== 侧边栏（浅色玻璃，与登录页同语言） ======== */
.sidebar {
  width: 232px; flex-shrink: 0; background: rgba(255,255,255,.72); color: #565b6e;
  display: flex; flex-direction: column;
  border-right: 1px solid rgba(20,22,31,.06);
  backdrop-filter: blur(20px) saturate(1.4);
}
.sidebar .logo {
  padding: 24px 20px 18px; font-size: 17px; font-weight: 800; color: var(--text);
  display: flex; align-items: center; gap: 10px; letter-spacing: -.01em;
  position: relative;
}
.sidebar .logo::after {
  content: ''; position: absolute; left: 20px; right: 20px; bottom: 0;
  height: 1px; background: linear-gradient(90deg, rgba(20,22,31,.08), transparent);
}
.sidebar .logo i {
  width: 24px; height: 24px; border-radius: 8px; flex-shrink: 0;
  background: var(--grad);
  box-shadow: 0 2px 10px rgba(79,70,229,.35);
  display: inline-flex; align-items: center; justify-content: center;
}
.sidebar .logo i::before {
  content: ''; width: 9px; height: 9px; border-radius: 2.5px;
  background: rgba(255,255,255,.92);
}
.sidebar nav { flex: 1; padding: 14px 12px; overflow-y: auto; }
.sidebar nav button {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  padding: 10px 12px; margin-bottom: 3px; border: 1px solid transparent; border-radius: 10px;
  background: transparent; color: #565b6e; font-size: 14px; cursor: pointer; transition: .2s ease;
  position: relative;
}
.sidebar nav button .m-ico {
  width: 26px; height: 26px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1; border-radius: 7px;
  background: rgba(79,70,229,.07);
  transition: .2s ease;
}
.sidebar nav button:hover { background: rgba(79,70,229,.07); color: var(--text); }
.sidebar nav button:hover .m-ico { background: rgba(79,70,229,.14); }
.sidebar nav button.on {
  background: var(--grad); color: #fff; font-weight: 700;
  box-shadow: 0 6px 16px rgba(79,70,229,.32);
}
.sidebar nav button.on .m-ico { background: rgba(255,255,255,.22); }
.sidebar nav button.on::before {
  content: ''; position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 18px; border-radius: 3px; background: rgba(255,255,255,.9);
}
.sidebar nav .m-txt { line-height: 1.3; }
.sidebar nav::-webkit-scrollbar { width: 6px; }
.sidebar nav::-webkit-scrollbar-thumb {
  background: rgba(20,22,31,.14); border: none; border-radius: 6px;
}

/* ======== 顶栏 ======== */
.right { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 60px; flex-shrink: 0; background: rgba(255,255,255,.72);
  border-bottom: 1px solid rgba(20,22,31,.07);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 30px; gap: 12px; backdrop-filter: blur(16px) saturate(1.4);
  position: relative; z-index: 40;
}
.topbar .tb-title {
  font-size: 17px; font-weight: 800; letter-spacing: -.02em;
  display: flex; align-items: center; gap: 10px;
}
.topbar .tb-title::before {
  content: ''; width: 3px; height: 16px; border-radius: 3px;
  background: var(--grad);
}
.topbar .tb-right { position: relative; display: flex; align-items: center; gap: 16px; }
.topbar .tb-user { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.topbar .avatar {
  width: 34px; height: 34px; border-radius: 11px; background: var(--grad);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(79,70,229,.3), inset 0 1px 0 rgba(255,255,255,.25);
}
.topbar .tb-name { font-size: 13px; font-weight: 700; line-height: 1.2; }
.topbar .tb-role { font-size: 11px; color: var(--muted); line-height: 1.2; }

/* ======== 主区域 ======== */
.main {
  flex: 1; overflow: auto; padding: 28px 32px 40px;
  scrollbar-gutter: stable;
}
.page-title { font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
.page-sub { color: var(--muted); margin: 6px 0 24px; line-height: 1.7; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 22px; margin-bottom: 16px;
  box-shadow: 0 1px 2px rgba(31,35,60,.03), 0 10px 30px rgba(31,35,60,.05);
  transition: box-shadow .25s ease, border-color .25s ease;
}
.card:hover { border-color: #d8dce8; box-shadow: 0 2px 4px rgba(31,35,60,.04), 0 16px 40px rgba(31,35,60,.08); }
.card h3 { font-size: 16px; margin-bottom: 14px; letter-spacing: -.01em; }
.empty { text-align: center; color: var(--muted); padding: 34px 0; }
.loading {
  padding: 60px 0; text-align: center; color: var(--muted);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.loading i {
  width: 15px; height: 15px; border: 2px solid #dfe3f0;
  border-top-color: var(--accent-deep); border-radius: 50%;
  animation: bootsp .8s linear infinite;
}

/* ======== 控件 ======== */
.btn {
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  padding: 9px 16px; border: 1px solid transparent; border-radius: 10px;
  background: linear-gradient(135deg, #6d28d9, #4f46e5 55%, #2563eb); color: #fff;
  font-size: 14px; font-weight: 600; letter-spacing: .01em; line-height: 1.2;
  white-space: nowrap; cursor: pointer;
  box-shadow: 0 1px 2px rgba(67,56,202,.28), inset 0 1px 0 rgba(255,255,255,.22);
  transition: background .18s ease, border-color .18s ease, box-shadow .18s ease, transform .1s ease, filter .18s ease;
}
.btn:hover { background: linear-gradient(135deg, #5b21b6, #4338ca 55%, #1d4ed8); box-shadow: 0 2px 4px rgba(67,56,202,.26), 0 8px 20px rgba(79,70,229,.28), inset 0 1px 0 rgba(255,255,255,.22); }
.btn:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(67,56,202,.35), inset 0 1px 2px rgba(0,0,0,.2); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; filter: saturate(.7); }
.btn.ghost { background: #fff; color: var(--text); border-color: var(--border); box-shadow: none; }
.btn.ghost:hover { background: #f5f7fc; border-color: #c9cede; box-shadow: none; }
.btn.ghost:active { background: #eef0f7; transform: none; box-shadow: none; }
.btn.accent { background: var(--grad); box-shadow: 0 1px 2px rgba(79,70,229,.3), inset 0 1px 0 rgba(255,255,255,.25); }
.btn.accent:hover { background: linear-gradient(120deg, #6d28d9, #4338ca 45%, #1d4ed8); box-shadow: 0 2px 4px rgba(79,70,229,.28), 0 8px 20px rgba(79,70,229,.3), inset 0 1px 0 rgba(255,255,255,.25); }
.btn.accent:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(79,70,229,.38); }
.btn.danger { background: linear-gradient(180deg, #e0564a, #cf3c2f); box-shadow: 0 1px 2px rgba(160,40,30,.25), inset 0 1px 0 rgba(255,255,255,.15); }
.btn.danger:hover { background: linear-gradient(180deg, #d64a3e, #c03227); box-shadow: 0 2px 4px rgba(160,40,30,.2), 0 8px 20px rgba(207,60,47,.25), inset 0 1px 0 rgba(255,255,255,.15); }
.btn.danger:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(160,40,30,.3); }
.btn.small { padding: 5px 12px; font-size: 13px; border-radius: 9px; }
button:focus-visible, a:focus-visible { outline: 2px solid rgba(79,70,229,.6); outline-offset: 2px; }
/* :where 零特异性：无 type 的文本输入也吃全局样式，且不压过 .global-search 等自定义类 */
input:where([type=text], [type=password], [type=number], [type=email], [type=search], [type=tel], [type=url], [type=date], :not([type])), textarea, select {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border);
  border-radius: 10px; font-size: 14px; font-family: inherit; background: var(--soft);
  outline: none; transition: .2s ease;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(79,70,229,.1); }
/* Element Plus 输入框：外框由 .el-input__wrapper 负责，这里屏蔽上面的全局规则，
   否则内层 <input> 会长出第二层边框、内边距和聚焦光环。.el-input__inner 选择器特异性更高，顺序无关。 */
.el-input .el-input__inner,
.el-input .el-input__inner:focus {
  padding: 0; border: none; border-radius: 0; background: transparent; box-shadow: none;
}
.el-input {
  --el-color-primary: var(--accent); --el-border-color: var(--border);
  --el-border-color-hover: var(--accent); --el-border-color-focus: var(--accent);
  --el-border-radius-base: 10px; --el-font-size-base: 13px;
}
textarea { resize: vertical; min-height: 80px; }
.label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 12px; align-items: center; }
.row > * { flex: 1; }
/* 按钮和图片不参与拉伸，保持自然宽度（避免被拉成长条） */
.row > button, .row > img, .row > a, .row > span { flex: 0 0 auto; }
/* 上面把 span 一起钉成了不可压缩，装用户内容（文件名等无空格长串）时会把同行按钮顶出容器。
   .shrink 给这类文本格重新开放收缩并允许任意断行，按钮保持 flex:0 0 auto 钉在右侧。 */
.row > .shrink { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.row .btns { flex: 0 0 auto; display: flex; gap: 10px; align-items: flex-end; align-self: flex-end; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tag {
  display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px;
  background: #eef2ff; color: #4338ca;
}
.tag.ok { background: #ecfdf5; color: #059669; }
.tag.bad { background: #fef2f2; color: #dc2626; }
.err {
  background: #fbf0ef; border: 1px solid #eed4d1; color: #b3423a;
  padding: 10px 14px; border-radius: 10px; margin-bottom: 14px;
}

/* ======== 答疑 ======== */
.chat-wrap { display: flex; gap: 16px; height: calc(100vh - 60px - 68px); }
.side {
  width: 252px; flex-shrink: 0; display: flex; flex-direction: column;
  background: rgba(255,255,255,.6); border: 1px solid var(--border);
  border-radius: 16px; padding: 14px; overflow: hidden; margin-bottom: 0;
  backdrop-filter: blur(8px); box-shadow: none; transition: none;
}
.chat-wrap .side.card:hover { border-color: var(--border); box-shadow: none; }
.mode-tabs { display: flex; gap: 6px; margin: 4px 0 12px; background: #eef0f6; border-radius: 12px; padding: 4px; }
.mode-tabs button {
  flex: 1; padding: 7px 0; border: none; border-radius: 9px;
  background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
  transition: .2s ease;
}
.mode-tabs button:hover { color: var(--text); }
.mode-tabs button.on { background: #fff; color: var(--text); font-weight: 700; box-shadow: 0 2px 8px rgba(31,35,60,.1); }
.sess-list { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.sess {
  padding: 9px 12px; border-radius: 10px; cursor: pointer; font-size: 13px;
  display: flex; align-items: center; gap: 6px;
  overflow: hidden; margin-bottom: 3px; transition: background .18s ease;
}
.sess .sess-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess-mode-tag {
  font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #e8eaf2;
  color: #6b7286; flex-shrink: 0;
}
.sess.on .sess-mode-tag { background: #e0e7ff; color: #4338ca; }
.sess-ops { display: none; gap: 2px; flex-shrink: 0; }
.sess:hover .sess-ops { display: flex; }
.sess.on .sess-ops { display: flex; }
.sess-btn {
  border: none; background: transparent; color: var(--muted); cursor: pointer;
  width: 20px; height: 20px; line-height: 20px; border-radius: 4px; font-size: 12px;
}
.sess-btn:hover { background: rgba(0,0,0,.08); color: var(--text); }
.sess.on .sess-btn:hover { background: rgba(79,70,229,.16); }
.sess-input {
  flex: 1; padding: 4px 8px; border: 1px solid var(--primary); border-radius: 6px;
  font-size: 13px; outline: none; min-width: 0;
}
.sess:hover { background: rgba(20,22,31,.04); }
.sess.on { background: #e0e7ff; color: #3730a3; font-weight: 600; }
.chatbox {
  flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--card);
  border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(31,35,60,.03), 0 10px 30px rgba(31,35,60,.05);
}
.msgs {
  flex: 1; overflow-y: auto; padding: 22px 24px;
  background-image:
    radial-gradient(600px 300px at 100% 0%, rgba(79,70,229,.045), transparent 55%);
}
.m { display: flex; gap: 10px; margin-bottom: 18px; animation: msg-in .22s ease; }
@keyframes msg-in { from { opacity: 0; transform: translateY(6px); } }
.m .av {
  width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px;
  box-shadow: 0 2px 6px rgba(31,35,60,.15);
}
.m.me { flex-direction: row-reverse; }
.m.me .av { background: var(--grad); }
.m.ai .av { background: var(--grad); }
.m .bub {
  max-width: 76%; padding: 12px 16px; border-radius: 4px 14px 14px 14px; line-height: 1.75;
  background: #f8f9fc; border: 1px solid var(--border);
  box-shadow: 0 1px 3px rgba(31,35,60,.03);
}
.m.me .bub { background: var(--primary); color: #fff; border: none; border-radius: 14px 4px 14px 14px; }
.bub p { margin: 4px 0; }
.bub ul { padding-left: 18px; margin: 4px 0; }
.bub h1, .bub h2, .bub h3, .bub h4 { margin: 8px 0 4px; }
.bub pre {
  background: #1e1b3a; color: #e3e7f7; padding: 13px; border-radius: 10px;
  overflow-x: auto; font-size: 12.5px; margin: 8px 0; line-height: 1.6;
}
.bub pre code { background: transparent; padding: 0; color: inherit; }
.bub blockquote { border-left: 3px solid #a5b4fc; padding-left: 10px; color: var(--muted); margin: 6px 0; }
.bub code { background: #e9ecf8; padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
.m.me .bub code { background: rgba(255,255,255,.18); }
.sources {
  margin-top: 8px; font-size: 12px; color: #4338ca;
  background: #eef2ff; border-radius: 8px; padding: 6px 10px; line-height: 1.7;
}
.stream-txt { white-space: pre-wrap; word-break: break-word; }
.cursor {
  display: inline-block; width: 8px; height: 15px; background: var(--primary);
  vertical-align: -2px; animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.input-bar {
  border-top: 1px solid var(--border); padding: 14px 18px;
  display: flex; gap: 12px; align-items: flex-end;
  background: rgba(255,255,255,.7);
}
.input-bar textarea { flex: 1; min-height: 44px; max-height: 130px; border-radius: 12px; }
.input-bar .btn { border-radius: 12px; height: 44px; padding: 0 20px; }

/* ======== Markdown 渲染（mdToHtml：答疑/讲义/学情建议/学习报告 v-html 内容） ======== */
.md-divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
.md-table-wrap { overflow-x: auto; margin: 8px 0; }
.md-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.md-table th, .md-table td {
  border: 1px solid var(--border); padding: 7px 10px; line-height: 1.65;
  text-align: left; vertical-align: top;
}
.md-table th { background: #f7f8fc; font-weight: 700; white-space: nowrap; }
.md-table tbody tr:nth-child(even) { background: #fafbfe; }

/* ======== 练习 ======== */
.q {
  padding: 16px 18px; margin-bottom: 12px; background: #fff;
  border: 1px solid var(--border); border-radius: 12px;
}
.q .head { display: flex; justify-content: space-between; margin-bottom: 10px; }
.q .type { font-weight: 700; color: #4338ca; }
.q .kp { color: var(--muted); font-size: 12px; }
.opt {
  display: block; padding: 8px 12px; margin: 6px 0; border: 1px solid var(--border);
  border-radius: 8px; cursor: pointer;
}
.opt:hover { border-color: var(--primary); }
.opt.on { border-color: var(--accent); background: #eef2ff; }
.opt input { margin-right: 8px; }
.ans { margin-top: 8px; padding: 8px 12px; background: #f8fafc; border-radius: 8px; font-size: 13px; }
.ans.ai { background: #eef2ff; color: #4338ca; }
.stat { text-align: center; padding: 14px; }
.stat .num { font-size: 25px; font-weight: 800; color: #4338ca; }
.stat .lab { color: var(--muted); font-size: 12px; margin-top: 3px; }
.pass { border-left: 4px solid #10b981; }
.fail { border-left: 4px solid #ef4444; }

/* ======== 学情 ======== */
.mb { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.mb .nm { width: 110px; flex-shrink: 0; }
.mb .tr { flex: 1; height: 10px; background: #eef2f7; border-radius: 6px; overflow: hidden; }
.mb .fl { height: 100%; background: linear-gradient(90deg,#f43f5e,#f59e0b,#10b981); }
.mb .vl { width: 42px; text-align: right; font-weight: 600; }
.mb .ct { width: 70px; color: var(--muted); font-size: 12px; }

/* ======== 表格 ======== */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
th { color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: none; }
tbody tr { transition: background .15s ease; }
tbody tr:hover { background: rgba(20,22,31,.025); }
a.link { color: var(--primary); cursor: pointer; }
a.link:hover { color: var(--accent-deep); text-decoration: underline; }

/* ======== 生成 ======== */
.gen { background: #1e1b3a; color: #e3e7f7; border-radius: 14px; padding: 20px; line-height: 1.85; font-size: 13.5px; white-space: pre-wrap; max-height: 460px; overflow-y: auto; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.qi { padding: 14px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; background: #fff; transition: border-color .2s ease; }
.qi:hover { border-color: #d8dce8; }
.qi .hd { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }

/* ======== 路由过渡 ======== */
.page-fade-enter-active { transition: opacity .22s ease, transform .22s ease; }
.page-fade-leave-active { transition: opacity .12s ease; }
.page-fade-enter-from { opacity: 0; transform: translateY(8px); }
.page-fade-leave-to { opacity: 0; }

/* ======== 弹窗 ======== */
.modal-mask {
  position: fixed; inset: 0; z-index: 200; background: rgba(16,18,32,.45);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(4px);
  animation: mask-in .18s ease;
}
@keyframes mask-in { from { opacity: 0; } }
.modal-box {
  background: #fff; border-radius: 16px; padding: 24px;
  width: min(400px, 92vw); box-shadow: 0 24px 80px rgba(16,18,32,.3);
  animation: box-in .22s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes box-in { from { opacity: 0; transform: translateY(10px) scale(.97); } }
.modal-box h3 { margin-bottom: 10px; font-size: 16px; letter-spacing: -.01em; }
.modal-box p { color: var(--muted); font-size: 13px; line-height: 1.8; margin-bottom: 18px; word-break: break-all; }
.modal-ops { display: flex; justify-content: flex-end; gap: 10px; }

/* ======== 响应式适配 ======== */

/* 平板（≤1024px） */
@media (max-width: 1024px) {
  .main { padding: 18px 16px; }
  .grid2 { grid-template-columns: 1fr; }
}

/* 手机（≤768px）：侧边栏 → 顶部导航栏，内容纵向堆叠 */
@media (max-width: 768px) {
  #app { height: 100vh; height: 100dvh; flex-direction: column; }

  /* 侧边栏变顶栏 */
  .sidebar {
    width: 100%; flex-direction: row; align-items: center;
    padding: 8px 10px; gap: 8px;
    position: sticky; top: 0; z-index: 50;
  }
  .sidebar .logo { padding: 0; font-size: 14px; gap: 8px; flex-shrink: 0; }
  .sidebar .logo::after { display: none; }
  .sidebar .logo i { width: 20px; height: 20px; }
  .sidebar nav {
    flex: 1; display: flex; gap: 4px; padding: 0;
    overflow-x: auto; scrollbar-width: none;
  }
  .sidebar nav::-webkit-scrollbar { display: none; }
  .sidebar nav button {
    width: auto; flex: 1 0 auto; text-align: center; justify-content: center;
    padding: 8px 10px; font-size: 13px; margin: 0; white-space: nowrap;
    flex-direction: column; gap: 4px;
  }
  .sidebar nav button .m-ico {
    width: 22px; height: 22px; font-size: 13px; border-radius: 6px;
  }
  .sidebar nav button.on::before { display: none; }
  .sidebar nav .m-txt { font-size: 11px; line-height: 1.1; }

  /* 顶栏 */
  .topbar { padding: 0 12px; gap: 8px; }
  .topbar .tb-title { font-size: 14px; }
  .topbar .tb-right { gap: 10px; }
  .topbar .tb-user-info { display: none; }

  /* 主区?*/
  .main { padding: 14px 12px calc(22px + env(safe-area-inset-bottom)); }

  /* 表单行纵向堆叠，按钮组保持横排 */
  .row { flex-direction: column; align-items: stretch; gap: 10px; }
  .row > * { flex: none !important; width: 100%; }

  /* 答疑：会话栏转顶部卡片 */
  .chat-wrap { flex-direction: column; height: calc(100dvh - 60px - 40px); }
  .side { width: 100%; max-height: 240px; min-height: 0; }
  .chatbox { min-height: 0; }
  .m .bub { max-width: 88%; }
  .gen { max-height: 60vh; }

  /* 学情掌握度条换行 */
  .mb { flex-wrap: wrap; row-gap: 4px; }
  .mb .nm { width: 100%; }
  .mb .tr { flex: 1 1 100%; }

  /* 表格横向滚动 */
  table { display: block; overflow-x: auto; }
  th, td { white-space: nowrap; }

  /* 题干与标签换行 */
  .q .head { flex-wrap: wrap; gap: 6px; }
}
</style>
</head>

<div id="app"><div class="boot-splash"><i></i>正在加载智学助手…</div></div>
<script type="module" src="/src/main.js"></script>
</body>
