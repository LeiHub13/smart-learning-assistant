<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智学助手 - 基于大语言模型的智能学习助手</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1a1a1a; --primary-dark: #333; --accent: #b8956a;
  --accent-deep: #8c6844;
  --bg: #f5f3ef; --card: #fff; --text: #1a1a1a;
  --muted: #888; --border: #e0ddd6; --soft: #fafafa;
}
html, body { background: var(--bg); }
body {
  font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text); font-size: 14px;
  background-image:
    radial-gradient(1000px 520px at 88% -10%, rgba(184,149,106,.12), transparent 62%),
    radial-gradient(860px 480px at -8% 110%, rgba(184,149,106,.08), transparent 60%),
    linear-gradient(rgba(0,0,0,.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.015) 1px, transparent 1px);
  background-size: auto, auto, 44px 44px, 44px 44px;
  background-attachment: fixed;
}
#app { height: 100vh; display: flex; background: transparent; }
::selection { background: rgba(184,149,106,.32); }

/* 全局细滚动条 */
* { scrollbar-width: thin; scrollbar-color: rgba(120,110,95,.35) transparent; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: rgba(120,110,95,.3); border-radius: 8px;
  border: 2px solid transparent; background-clip: content-box;
}
*::-webkit-scrollbar-thumb:hover {
  background: rgba(120,110,95,.5); border: 2px solid transparent; background-clip: content-box;
}

/* 启动遮罩：Vue 挂载前显示，杜绝白屏 */
.boot-splash {
  position: fixed; inset: 0; z-index: 999;
  display: flex; align-items: center; justify-content: center;
  gap: 10px; color: var(--muted); background: var(--bg);
}
.boot-splash i {
  width: 20px; height: 20px; border: 2px solid #dbe3f5;
  border-top-color: var(--primary); border-radius: 50%;
  animation: bootsp .8s linear infinite;
}
@keyframes bootsp { to { transform: rotate(360deg); } }

/* ======== 侧边栏 ======== */
.sidebar {
  width: 232px; flex-shrink: 0; background: #1b1a18; color: #a8a29e;
  display: flex; flex-direction: column;
  border-right: 1px solid rgba(255,255,255,.04);
}
.sidebar .logo {
  padding: 24px 20px 18px; font-size: 17px; font-weight: 800; color: #fff;
  display: flex; align-items: center; gap: 10px; letter-spacing: -.01em;
  position: relative;
}
.sidebar .logo::after {
  content: ''; position: absolute; left: 20px; right: 20px; bottom: 0;
  height: 1px; background: linear-gradient(90deg, rgba(255,255,255,.1), transparent);
}
.sidebar .logo i {
  width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0;
  background: linear-gradient(135deg, #d3a76c, #a67c46);
  box-shadow: 0 2px 10px rgba(211,167,108,.4);
  display: inline-flex; align-items: center; justify-content: center;
}
.sidebar .logo i::before {
  content: ''; width: 8px; height: 8px; border-radius: 2px;
  background: #1b1a18;
}
.sidebar nav { flex: 1; padding: 14px 12px; overflow-y: auto; }
.sidebar nav button {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  padding: 10px 12px; margin-bottom: 3px; border: 1px solid transparent; border-radius: 10px;
  background: transparent; color: #a8a29e; font-size: 14px; cursor: pointer; transition: .2s ease;
  position: relative;
}
.sidebar nav button .m-ico {
  width: 26px; height: 26px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1; border-radius: 7px;
  background: rgba(255,255,255,.06); filter: grayscale(.35); opacity: .85;
  transition: .2s ease;
}
.sidebar nav button:hover { background: rgba(255,255,255,.07); color: #f5f5f4; }
.sidebar nav button:hover .m-ico { filter: grayscale(0); opacity: 1; background: rgba(255,255,255,.12); }
.sidebar nav button.on {
  background: #fff; color: #1a1a1a; font-weight: 700;
  box-shadow: 0 6px 18px rgba(0,0,0,.3);
}
.sidebar nav button.on .m-ico { background: #f2eadf; filter: grayscale(0); opacity: 1; }
.sidebar nav button.on::before {
  content: ''; position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 18px; border-radius: 3px; background: var(--accent);
}
.sidebar nav .m-txt { line-height: 1.3; }
.sidebar nav::-webkit-scrollbar { width: 6px; }
.sidebar nav::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.16); border: none; border-radius: 6px;
}

/* ======== 顶栏 ======== */
.right { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 60px; flex-shrink: 0; background: rgba(255,255,255,.72);
  border-bottom: 1px solid rgba(224,221,214,.9);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 30px; gap: 12px; backdrop-filter: blur(16px) saturate(1.4);
  position: relative; z-index: 40;
}
.topbar .tb-title {
  font-size: 17px; font-weight: 800; letter-spacing: -.02em;
  display: flex; align-items: center; gap: 10px;
}
.topbar .tb-title::before {
  content: ''; width: 3px; height: 16px; border-radius: 3px;
  background: linear-gradient(180deg, #d3a76c, #a67c46);
}
.topbar .tb-right { position: relative; display: flex; align-items: center; gap: 16px; }
.topbar .tb-user { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.topbar .avatar {
  width: 34px; height: 34px; border-radius: 11px; background: var(--primary);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(26,26,26,.25), inset 0 1px 0 rgba(255,255,255,.15);
}
.topbar .tb-name { font-size: 13px; font-weight: 700; line-height: 1.2; }
.topbar .tb-role { font-size: 11px; color: var(--muted); line-height: 1.2; }

/* ======== 主区域 ======== */
.main {
  flex: 1; overflow: auto; padding: 28px 32px 40px;
  scrollbar-gutter: stable;
}
.page-title { font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
.page-sub { color: var(--muted); margin: 6px 0 24px; line-height: 1.7; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 22px; margin-bottom: 16px;
  box-shadow: 0 1px 2px rgba(26,26,26,.03), 0 10px 30px rgba(26,26,26,.045);
  transition: box-shadow .25s ease, border-color .25s ease;
}
.card:hover { border-color: #d6d0c6; box-shadow: 0 2px 4px rgba(26,26,26,.04), 0 16px 40px rgba(26,26,26,.07); }
.card h3 { font-size: 16px; margin-bottom: 14px; letter-spacing: -.01em; }
.empty { text-align: center; color: var(--muted); padding: 34px 0; }
.loading {
  padding: 60px 0; text-align: center; color: var(--muted);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.loading i {
  width: 15px; height: 15px; border: 2px solid #e7ded2;
  border-top-color: var(--accent-deep); border-radius: 50%;
  animation: bootsp .8s linear infinite;
}

/* ======== 控件 ======== */
.btn {
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  padding: 9px 18px; border: none; border-radius: 10px;
  background: var(--primary); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: .2s ease;
  box-shadow: 0 1px 2px rgba(26,26,26,.18);
}
.btn:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 8px 18px rgba(26,26,26,.2); }
.btn:active { transform: translateY(0); box-shadow: 0 2px 6px rgba(26,26,26,.15); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.ghost { background: #fff; color: var(--text); border: 1px solid var(--border); box-shadow: none; }
.btn.ghost:hover { background: #faf8f5; border-color: #c8c4bc; box-shadow: 0 4px 12px rgba(26,26,26,.08); }
.btn.danger { background: #e24b3f; }
.btn.danger:hover { background: #d33d31; }
.btn.small { padding: 5px 12px; font-size: 13px; }
button:focus-visible, a:focus-visible { outline: 2px solid rgba(184,149,106,.7); outline-offset: 2px; }
input[type=text], input[type=password], input[type=number], textarea, select {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border);
  border-radius: 10px; font-size: 14px; font-family: inherit; background: var(--soft);
  outline: none; transition: .2s ease;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(184,149,106,.1); }
textarea { resize: vertical; min-height: 80px; }
.label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 12px; align-items: center; }
.row > * { flex: 1; }
.row .btns { flex: 0 0 auto; display: flex; gap: 10px; align-items: flex-end; align-self: flex-end; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tag {
  display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px;
  background: #f4ede5; color: #8c6844;
}
.tag.ok { background: #ecfdf5; color: #059669; }
.tag.bad { background: #fef2f2; color: #dc2626; }
.err {
  background: #fbf0ef; border: 1px solid #eed4d1; color: #b3423a;
  padding: 10px 14px; border-radius: 10px; margin-bottom: 14px;
}

/* ======== 登录 ======== */
.login {
  position: fixed; inset: 0; z-index: 100; background: #fff;
  display: flex;
}
.login .intro {
  flex: 3; background: linear-gradient(135deg,#171f33,#243255);
  color: #e2e8f0; display: flex; align-items: center; justify-content: center;
  padding: 40px; overflow: auto;
}
.login .intro-in { max-width: 660px; width: 100%; }
.login .brand {
  font-size: 30px; font-weight: 800; color: #fff; letter-spacing: 1px;
  display: flex; align-items: center; gap: 10px;
}
.login .brand i {
  width: 14px; height: 14px; border-radius: 50%;
  background: #7c9bff; box-shadow: 0 0 14px #7c9bff;
}
.login .slogan { color: #8fa3c8; font-size: 15px; margin: 10px 0 34px; }
.login .feats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.login .feat {
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
  border-radius: 12px; padding: 16px 18px;
}
.login .feat .ft { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 6px; }
.login .feat .ft::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #7c9bff; margin-right: 8px; vertical-align: 2px; }
.login .feat .fd { font-size: 13px; color: #a5b4d0; line-height: 1.8; }
.login .arch {
  margin-top: 30px; font-size: 12px; color: #5d7099; letter-spacing: .5px;
}
.login .box {
  flex: 1; background: #fff; display: flex; flex-direction: column;
  justify-content: center; padding: 40px 46px; min-width: 320px;
}
.login h1 { text-align: center; font-size: 21px; }
.login .sub { text-align: center; color: var(--muted); font-size: 13px; margin: 4px 0 22px; }
.login .f { margin-bottom: 12px; }
.login .tips {
  margin-top: 16px; font-size: 12px; color: var(--muted); background: #f8fafc;
  padding: 10px 12px; border-radius: 8px; line-height: 1.9;
}
.login .tips b { color: var(--primary-dark); }
.login .sw { text-align: center; margin-top: 14px; font-size: 13px; color: var(--muted); }
.login .sw a { color: var(--primary); cursor: pointer; }

/* ======== 答疑 ======== */
.chat-wrap { display: flex; gap: 16px; height: calc(100vh - 60px - 68px); }
.side {
  width: 252px; flex-shrink: 0; display: flex; flex-direction: column;
  background: rgba(255,255,255,.6); border: 1px solid var(--border);
  border-radius: 16px; padding: 14px; overflow: hidden; margin-bottom: 0;
  backdrop-filter: blur(8px); box-shadow: none; transition: none;
}
.chat-wrap .side.card:hover { border-color: var(--border); box-shadow: none; }
.mode-tabs { display: flex; gap: 6px; margin: 4px 0 12px; background: #efe9e1; border-radius: 12px; padding: 4px; }
.mode-tabs button {
  flex: 1; padding: 7px 0; border: none; border-radius: 9px;
  background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
  transition: .2s ease;
}
.mode-tabs button:hover { color: var(--text); }
.mode-tabs button.on { background: #fff; color: #1a1a1a; font-weight: 700; box-shadow: 0 2px 8px rgba(26,26,26,.1); }
.sess-list { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.sess {
  padding: 9px 12px; border-radius: 10px; cursor: pointer; font-size: 13px;
  display: flex; align-items: center; gap: 6px;
  overflow: hidden; margin-bottom: 3px; transition: background .18s ease;
}
.sess .sess-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess-mode-tag {
  font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #e7e2da;
  color: #8a7d6b; flex-shrink: 0;
}
.sess.on .sess-mode-tag { background: #e8dcc9; color: #8c6844; }
.sess-ops { display: none; gap: 2px; flex-shrink: 0; }
.sess:hover .sess-ops { display: flex; }
.sess.on .sess-ops { display: flex; }
.sess-btn {
  border: none; background: transparent; color: var(--muted); cursor: pointer;
  width: 20px; height: 20px; line-height: 20px; border-radius: 4px; font-size: 12px;
}
.sess-btn:hover { background: rgba(0,0,0,.08); color: var(--text); }
.sess.on .sess-btn:hover { background: rgba(184,149,106,.18); }
.sess-input {
  flex: 1; padding: 4px 8px; border: 1px solid var(--primary); border-radius: 6px;
  font-size: 13px; outline: none; min-width: 0;
}
.sess:hover { background: rgba(26,26,26,.04); }
.sess.on { background: #f2e9dc; color: #5c4727; font-weight: 600; }
.chatbox {
  flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--card);
  border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(26,26,26,.03), 0 10px 30px rgba(26,26,26,.05);
}
.msgs {
  flex: 1; overflow-y: auto; padding: 22px 24px;
  background-image:
    radial-gradient(600px 300px at 100% 0%, rgba(184,149,106,.05), transparent 55%);
}
.m { display: flex; gap: 10px; margin-bottom: 18px; animation: msg-in .22s ease; }
@keyframes msg-in { from { opacity: 0; transform: translateY(6px); } }
.m .av {
  width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
}
.m.me { flex-direction: row-reverse; }
.m.me .av { background: var(--primary); }
.m.ai .av { background: linear-gradient(135deg, #c99a63, #a67c46); }
.m .bub {
  max-width: 76%; padding: 12px 16px; border-radius: 4px 14px 14px 14px; line-height: 1.75;
  background: #faf8f5; border: 1px solid var(--border);
  box-shadow: 0 1px 3px rgba(26,26,26,.03);
}
.m.me .bub { background: var(--primary); color: #fff; border: none; border-radius: 14px 4px 14px 14px; }
.bub p { margin: 4px 0; }
.bub ul { padding-left: 18px; margin: 4px 0; }
.bub h1, .bub h2, .bub h3, .bub h4 { margin: 8px 0 4px; }
.bub pre {
  background: #211f1c; color: #f2ede4; padding: 13px; border-radius: 10px;
  overflow-x: auto; font-size: 12.5px; margin: 8px 0; line-height: 1.6;
}
.bub pre code { background: transparent; padding: 0; color: inherit; }
.bub blockquote { border-left: 3px solid #d3b187; padding-left: 10px; color: var(--muted); margin: 6px 0; }
.bub code { background: #efe9e1; padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
.m.me .bub code { background: rgba(255,255,255,.18); }
.sources {
  margin-top: 8px; font-size: 12px; color: #8c6844;
  background: #f6efe5; border-radius: 8px; padding: 6px 10px; line-height: 1.7;
}
.stream-txt { white-space: pre-wrap; word-break: break-word; }
.cursor {
  display: inline-block; width: 8px; height: 15px; background: var(--primary);
  vertical-align: -2px; animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.input-bar {
  border-top: 1px solid var(--border); padding: 14px 18px;
  display: flex; gap: 12px; align-items: flex-end;
  background: rgba(255,255,255,.7);
}
.input-bar textarea { flex: 1; min-height: 44px; max-height: 130px; border-radius: 12px; }
.input-bar .btn { border-radius: 12px; height: 44px; padding: 0 20px; }

/* ======== 练习 ======== */
.q {
  padding: 16px 18px; margin-bottom: 12px; background: #fff;
  border: 1px solid var(--border); border-radius: 12px;
}
.q .head { display: flex; justify-content: space-between; margin-bottom: 10px; }
.q .type { font-weight: 700; color: #8c6844; }
.q .kp { color: var(--muted); font-size: 12px; }
.opt {
  display: block; padding: 8px 12px; margin: 6px 0; border: 1px solid var(--border);
  border-radius: 8px; cursor: pointer;
}
.opt:hover { border-color: var(--primary); }
.opt.on { border-color: var(--accent); background: #f4ede5; }
.opt input { margin-right: 8px; }
.ans { margin-top: 8px; padding: 8px 12px; background: #f8fafc; border-radius: 8px; font-size: 13px; }
.ans.ai { background: #f4ede5; color: #8c6844; }
.stat { text-align: center; padding: 14px; }
.stat .num { font-size: 25px; font-weight: 800; color: #8c6844; }
.stat .lab { color: var(--muted); font-size: 12px; margin-top: 3px; }
.pass { border-left: 4px solid #10b981; }
.fail { border-left: 4px solid #ef4444; }

/* ======== 学情 ======== */
.mb { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.mb .nm { width: 110px; flex-shrink: 0; }
.mb .tr { flex: 1; height: 10px; background: #eef2f7; border-radius: 6px; overflow: hidden; }
.mb .fl { height: 100%; background: linear-gradient(90deg,#f43f5e,#f59e0b,#10b981); }
.mb .vl { width: 42px; text-align: right; font-weight: 600; }
.mb .ct { width: 70px; color: var(--muted); font-size: 12px; }

/* ======== 表格 ======== */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
th { color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: none; }
tbody tr { transition: background .15s ease; }
tbody tr:hover { background: rgba(26,26,26,.02); }
a.link { color: var(--primary); cursor: pointer; }
a.link:hover { color: var(--accent-deep); text-decoration: underline; }

/* ======== 生成 ======== */
.gen { background: #242321; color: #eee8df; border-radius: 14px; padding: 20px; line-height: 1.85; font-size: 13.5px; white-space: pre-wrap; max-height: 460px; overflow-y: auto; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
.qi { padding: 14px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; background: #fff; transition: border-color .2s ease; }
.qi:hover { border-color: #d6d0c6; }
.qi .hd { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }

/* ======== 路由过渡 ======== */
.page-fade-enter-active { transition: opacity .22s ease, transform .22s ease; }
.page-fade-leave-active { transition: opacity .12s ease; }
.page-fade-enter-from { opacity: 0; transform: translateY(8px); }
.page-fade-leave-to { opacity: 0; }

/* ======== 弹窗 ======== */
.modal-mask {
  position: fixed; inset: 0; z-index: 200; background: rgba(26,26,26,.5);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(4px);
  animation: mask-in .18s ease;
}
@keyframes mask-in { from { opacity: 0; } }
.modal-box {
  background: #fff; border-radius: 16px; padding: 24px;
  width: min(400px, 92vw); box-shadow: 0 24px 80px rgba(0,0,0,.3);
  animation: box-in .22s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes box-in { from { opacity: 0; transform: translateY(10px) scale(.97); } }
.modal-box h3 { margin-bottom: 10px; font-size: 16px; letter-spacing: -.01em; }
.modal-box p { color: var(--muted); font-size: 13px; line-height: 1.8; margin-bottom: 18px; word-break: break-all; }
.modal-ops { display: flex; justify-content: flex-end; gap: 10px; }

/* ======== 响应式适配 ======== */

/* 平板（≤1024px） */
@media (max-width: 1024px) {
  .main { padding: 18px 16px; }
  .grid2 { grid-template-columns: 1fr; }
}

/* 手机（≤768px）：侧边栏 → 顶部导航栏，内容纵向堆叠 */
@media (max-width: 768px) {
  #app { height: 100vh; height: 100dvh; flex-direction: column; }

  /* 侧边栏变顶栏 */
  .sidebar {
    width: 100%; flex-direction: row; align-items: center;
    padding: 8px 10px; gap: 8px;
    position: sticky; top: 0; z-index: 50;
  }
  .sidebar .logo { padding: 0; font-size: 14px; gap: 8px; flex-shrink: 0; }
  .sidebar .logo::after { display: none; }
